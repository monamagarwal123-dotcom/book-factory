models:
  text_default: "claude-3-5-sonnet"
  text_cheap: "ollama/llama3.1:8b"
  # Meta AI is now primary - no token needed when using this chat
  image_gen: "meta-ai/muse-spark-image"
  image_gen_fallback: "black-forest-labs/flux-1.1-pro"
  image_inpaint: "stability-ai/sdxl-inpainting"
  image_outpaint: "stability-ai/sdxl"
  image_upscale: "nightmareai/real-esrgan"
  vision: "gpt-4o-mini"
  image_ref_strength: 0.8
  use_ip_adapter: true
  use_meta_ai: true

kdp:
  default_trim: "6x9"
  trims:
    "5x8": [5, 8]
    "5.5x8.5": [5.5, 8.5]
    "6x9": [6, 9]
    "8.5x11": [8.5, 11]
  bleed: 0.125
  dpi: 300

# How image generation works:
# 1. USE_META_AI=true (default) -> uses Meta AI via this chat (free, no API key)
# 2. REPLICATE_API_TOKEN set -> uses Replicate Flux as fallback
# 3. Neither -> placeholder for offline testing
